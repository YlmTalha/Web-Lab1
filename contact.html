<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charge Mahal | Contact</title>
</head>
<body>

  <header>
    <h1>Charge Mahal Enerji</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <hr>

  <main>

    <h2>Get in Touch</h2>
    <p>
      Charge Mahal Enerji A.S., Mavi Gol Cd. No:126, Bolluca / Arnavutkoy / Istanbul &mdash;
      444 5 831 &mdash; info@chargemahal.com
    </p>

    <form action="#" method="post">

      <fieldset>
        <legend>Your details</legend>

        <p>
          <label for="fullname">Full name</label><br>
          <input type="text" id="fullname" name="fullname" size="40" required>
        </p>

        <p>
          <label for="email">E-mail address</label><br>
          <input type="email" id="email" name="email" size="40" required>
        </p>

        <p>
          <label for="callback">Preferred date for a call back</label><br>
          <input type="date" id="callback" name="callback">
        </p>
      </fieldset>

      <fieldset>
        <legend>Your request</legend>

        <p>
          <label for="subject">Subject</label><br>
          <select id="subject" name="subject">
            <option value="support">Technical support</option>
            <option value="installation">New installation</option>
            <option value="partnership">Corporate partnership</option>
            <option value="billing">Billing and invoices</option>
          </select>
        </p>

        <p>
          <label for="message">Message</label><br>
          <textarea id="message" name="message" rows="6" cols="50" required></textarea>
        </p>
      </fieldset>

      <p>
        <button type="submit">Send message</button>
      </p>

    </form>

  </main>

  <hr>

  <footer>
    <p>Talha Yilmaz &mdash; &copy; 2026 Charge Mahal Enerji A.S.</p>
  </footer>

</body>
</html>
